/**:
  ros__parameters:
    # 1. Namespace updates for the swarm architecture
    robot_base_frame: "tb3_1/base_footprint"
    costmap_topic: "/tb3_1/global_costmap/costmap"
    costmap_updates_topic: "/tb3_1/global_costmap/costmap_updates"
    
    # 2. Crucial for Docker: Must be false to prevent GUI crash
    visualize: false
    
    # 3. Your custom tuning parameters
    planner_frequency: 0.1
    progress_timeout: 30.0
    potential_scale: 10.0
    orientation_scale: 0.0
    gain_scale: 0.1
    transform_tolerance: 0.3
    min_frontier_size: 0.35 
    use_sim_time: true
