explore_node:
  ros__parameters:
    robot_base_frame: "base_footprint"
    costmap_topic: "/global_costmap/costmap"
    costmap_updates_topic: "/global_costmap/costmap_updates"
    visualize: true
    planner_frequency: 0.1
    progress_timeout: 30.0
    potential_scale: 10.0
    orientation_scale: 0.0
    gain_scale: 0.1
    transform_tolerance: 0.3
    
    # --- ENVIRONMENT SPECIFIC PARAMS ---
    # [OFFICE] Use 0.25 to avoid micro-frontiers and stay efficient
    # min_frontier_size: 0.25
    
    # [WAREHOUSE] Use 0.35 to avoid exploring under slanted shelves and getting stuck
    min_frontier_size: 0.35
    # -----------------------------------
